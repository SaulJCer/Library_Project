<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="books" id="books">




    </div>
    <button command="show-modal" commandfor="newBookForm">New Book</button>
    <dialog id="newBookForm">
        <form method="dialog" submit="event.preventDefault(); addNewBook(
            document.getElementById('title'),
            document.getElementById('author'),
            document.getElementById('pages'),
            document.getElementById('read'))
        ">
            <label for="title">Title of Book</label>
            <input for="title" type="text" id="title">
            <label for="author">Author</label>
            <input for="author" type="text" id="author">
            <label for="pages">Pages</label>
            <input for="pages" type="text" id="pages">
            <label for="read">Have you read[answer READ or NOT READ]  </label>
            <input for="read" type="text" id="read">
            <input type="submit" value="ADD Book">
        </form>
    </dialog>

    <script src="index.js"></script>
</body>
</html>
